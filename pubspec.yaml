name: homefeel
description: "The homefeel concierge."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6
  get: ^4.6.6
  flutter_native_splash: ^2.4.0
  smooth_page_indicator: ^1.1.0
  pinput: ^5.0.0
  dropdown_button2: ^2.3.9
  iconly: ^1.0.1

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/whitelogo.png
  color_dark: "#1a1a1a"
  image_dark: assets/images/whitelogo.png

  android_12:
    icon_background_color: "#FFFFFF"
    image: assets/images/whitelogo.png
    icon_background_color_dark: "#1a1a1a"
    image_dark: assets/images/whitelogo.png

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/bkimages/
    - assets/icons/
    - assets/icons/homeicons/
    - assets/apartmentImages/

  fonts:
    - family: JosefinSans
      fonts:
        - asset: assets/fonts/JosefinSans-VariableFont_wght.ttf
        - asset: assets/fonts/JosefinSans-Bold.ttf
        - asset: assets/fonts/JosefinSans-Regular.ttf
        - asset: assets/fonts/JosefinSans-SemiBold.ttf

  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
